[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surround-sound-monitor-setup"
version = "1.0.0"
description = "Automatic Multi-Monitor Audio Setup & Spatial Soundstage Calibrator for Linux"
readme = "README.md"
authors = [{ name = "JTG Systems" }]
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
    "numpy>=1.20.0"
]

[project.scripts]
surround-sound-monitor-setup = "monitor_soundstage.cli:main"
ssms = "monitor_soundstage.cli:main"
monitor-soundstage = "monitor_soundstage.cli:main"
